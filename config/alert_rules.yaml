alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000 trên event response_sent'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602727
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602727
    runbook: docs/alerts.md#alert-2
  - name: LowQualityOrRetrievalSuccess
    severity: warning
    condition: 'mean(quality_score) < 0.75 hoặc retrieval success (tool_success == true) < 90%'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602727
    runbook: docs/alerts.md#alert-3
