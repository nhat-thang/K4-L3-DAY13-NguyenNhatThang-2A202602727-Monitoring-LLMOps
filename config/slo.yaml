service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Baseline của tôi (10 request, không có incident): P50 152ms, P95 1356ms (chỉ request đầu tiên
    chậm do khởi tạo), TTFT P95 50ms. Ngưỡng 3000ms cao hơn P95 baseline khoảng 2 lần nên đủ chỗ cho
    dao động bình thường nhưng vẫn bắt được rag_slow (+2.5s). Target 99.5% trong 28 ngày nghĩa là error
    budget 0.5%: với 10,000 request thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
